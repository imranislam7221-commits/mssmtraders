    <rect x="304" y="170" width="28" height="210" rx="6" fill="url(#gold)"/>
    <path d="M120 380 L392 380 L370 410 L142 410 Z" fill="url(#gold)"/>
  </g>
  <!-- Text Monogram -->
  <text x="256" y="380" font-family="'Noto Serif Bengali', 'Hind Siliguri', 'Segoe UI', sans-serif" font-weight="900" font-size="58" fill="#ffffff" text-anchor="middle" letter-spacing="3">মেসার্স এম.এস</text>
  <text x="256" y="430" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-weight="700" font-size="28" fill="#38bdf8" text-anchor="middle" letter-spacing="6">ট্রেডার্স • পিওএস</text>
